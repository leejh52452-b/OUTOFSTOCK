<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 종목 - OUTOFSTOCK</title>
    <link rel="icon" type="image/png" href="assets/logo-mark.png">
    <style>
        body[data-theme="brand-light"] {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --card-border: #cbd5e1;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #64748b;   /* 시안 #94a3b8 → 글자 대비 4.5:1 이상(웹 접근성 KWCAG 1.4.3) */
            --accent-blue: #3730a3;
            --accent-green: #16a34a;
            --accent-red: #dc2626;
            --input-bg: #ffffff;
            --hover-bg: #e0e7ff;
            --item-bg: #f8fafc;
            --art-plate: transparent;
            --login-bg: linear-gradient(180deg, #e0e7ff 0%, #ffffff 100%);
            --badge-mid-bg: #fef08a; --badge-mid-text: #854d0e;
            --badge-hard-bg: #fecdd3; --badge-hard-text: #9f1239;
            --guide-bg: #dbeafe; --guide-text: #1e40af;
        }
        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", Roboto, sans-serif;
            transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 이미지 공통: 어두운 테마에서는 밝은 판 위에 올려 외곽선이 묻히지 않게 */
        .art-plate { background-color: var(--art-plate); border-radius: 12px; }
        img { display: block; max-width: 100%; }

        /* 사이드바 */
        .sidebar {
            width: 244px; background-color: var(--card-bg);
            border-right: 1px solid var(--card-border);
            display: flex; flex-direction: column; z-index: 100; flex-shrink: 0;
        }
        .sidebar.collapsed { width: 72px; }
        .sidebar-header {
            height: 76px; display: flex; align-items: center;
            padding: 0 16px; gap: 10px; border-bottom: 1px solid var(--card-border);
        }
        .sidebar.collapsed .sidebar-header { justify-content: center; padding: 0; }
        .toggle-btn {
            background: none; border: none; color: var(--text-secondary);
            cursor: pointer; padding: 6px; border-radius: 6px; display: flex; align-items: center; flex-shrink: 0;
        }
        .toggle-btn:hover { background-color: var(--hover-bg); }
        .logo { display: flex; align-items: center; min-width: 0; }
        .logo-img { height: 38px; width: auto; padding: 3px 7px; box-sizing: content-box; max-width: 100%; }
        .sidebar.collapsed .logo { display: none; }
        /* 접힌 메뉴: 글자는 화면에서만 숨기고 스크린리더에는 남긴다(아이콘만 있는 링크에 이름 — 접근성 2.4.4) */
        .sidebar.collapsed .nav-text { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
        .nav-menu { list-style: none; padding: 16px 10px; }
        .nav-item { margin-bottom: 4px; }
        .nav-link {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 12px; color: var(--text-secondary);
            text-decoration: none; border-radius: 8px; font-weight: 500; font-size: 13.5px; white-space: nowrap;
        }
        .sidebar.collapsed .nav-link { justify-content: center; padding: 10px 0; }
        .nav-link svg { width: 18px; height: 18px; stroke: var(--text-secondary); flex-shrink: 0; }
        .nav-link:hover, .nav-link.active {
            background-color: var(--hover-bg); color: var(--accent-blue); font-weight: 600;
        }
        .nav-link:hover svg, .nav-link.active svg { stroke: var(--accent-blue); }

        /* 메인 */
        .main-wrapper { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow-y: auto; }
        header {
            position: relative; height: 76px; padding: 0 28px; display: flex; align-items: center;
            border-bottom: 1px solid var(--card-border); background-color: var(--card-bg);
        }
        .header-logo {
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            display: flex; align-items: center;
        }
        .header-logo img { height: 56px; width: auto; padding: 3px 12px; box-sizing: content-box; }
        .search-box { position: relative; width: 320px; max-width: 100%; }
        .search-box input {
            width: 100%; padding: 8px 16px 8px 36px; background-color: var(--item-bg);
            border: 1px solid var(--card-border); border-radius: 8px;
            color: var(--text-primary); outline: none; font-size: 13px;
        }
        .search-box input:focus { border-color: var(--accent-blue); }
        .search-icon {
            position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
            width: 16px; height: 16px; display: flex;
        }
        .search-icon svg { width: 16px; height: 16px; stroke: var(--text-muted); }
        .content-container {
            padding: 20px 28px; display: flex; flex-direction: column; gap: 20px;
            width: 100%; max-width: 1440px; margin: 0 auto;
        }


        [hidden] { display: none !important; }
        .main-wrapper { overflow-y: visible; }
        .content-container { word-break: keep-all; overflow-wrap: break-word; }
        svg.ico { width: 16px; height: 16px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .num { font-variant-numeric: tabular-nums; }
        .up { color: var(--accent-red); }
        .down { color: #2563eb; }

        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none;
            padding: 8px 14px; border-radius: 6px; font-size: 12.5px; font-weight: 700; cursor: pointer; font-family: inherit;
            border: 1px solid var(--card-border); background-color: var(--card-bg); color: var(--text-secondary);
            transition: background-color .15s, border-color .15s, color .15s, filter .15s;
        }
        .btn:hover { border-color: var(--accent-blue); color: var(--accent-blue); }
        .btn.primary { background-color: var(--accent-blue); border-color: var(--accent-blue); color: #fff; }
        .btn.primary:hover { filter: brightness(1.1); color: #fff; }
        .btn.outline { background-color: #fff; border-color: var(--accent-blue); color: var(--accent-blue); }
        .btn.outline:hover { background-color: var(--hover-bg); }
        .btn.sm { padding: 6px 11px; font-size: 12px; }
        .btn svg.ico { width: 14px; height: 14px; }
        .chip {
            display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; padding: 3px 9px;
            border-radius: 999px; background: var(--item-bg); border: 1px solid var(--card-border); color: var(--text-secondary); white-space: nowrap;
        }
        .seg-group { display: inline-flex; border: 1px solid var(--card-border); border-radius: 8px; overflow: hidden; background: var(--card-bg); }
        .seg { background: none; border: none; padding: 7px 14px; font-size: 12.5px; font-weight: 700; color: var(--text-secondary); cursor: pointer; font-family: inherit; }
        .seg + .seg { border-left: 1px solid var(--card-border); }
        .seg:hover { color: var(--accent-blue); }
        .seg.active { background: var(--hover-bg); color: var(--accent-blue); }

        .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
        .page-title { font-size: 20px; font-weight: 800; letter-spacing: -0.4px; }
        .page-sub { font-size: 12.5px; color: var(--text-secondary); margin-top: 4px; line-height: 1.5; }
        .upd { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); font-weight: 600; }
        .upd b { color: var(--text-secondary); font-weight: 700; }
        .sample-badge { background: var(--badge-mid-bg); color: var(--badge-mid-text); font-size: 10.5px; font-weight: 800; padding: 3px 8px; border-radius: 4px; }

        /* ===== 전체 배치: 왼쪽(이슈·테마·실시간) + 오른쪽(랭킹) ===== */
        .news-grid {
            display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start;
            grid-template-areas: "hero rank" "themes rank" "feed rank";
        }
        .news-grid.err { grid-template-columns: minmax(0, 1fr); grid-template-areas: "hero"; }
        .s-hero { grid-area: hero; } .s-themes { grid-area: themes; } .s-feed { grid-area: feed; }
        .s-rank { grid-area: rank; position: sticky; top: 12px; }
        .card { background-color: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 18px 20px; min-width: 0; }
        .sec-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
        .sec-title { display: flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 800; letter-spacing: -0.3px; }
        .sec-title .si { width: 28px; height: 28px; border-radius: 8px; background: var(--hover-bg); color: var(--accent-blue); display: flex; align-items: center; justify-content: center; }
        .sec-title .si svg.ico { width: 16px; height: 16px; }
        .sec-sub { font-size: 11.5px; color: var(--text-muted); font-weight: 600; }

        /* 순위 숫자 */
        .rk { width: 26px; height: 26px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; color: var(--text-muted); flex-shrink: 0; }
        .rk.r1 { background: var(--accent-blue); color: #fff; }
        .rk.r2 { background: #6366f1; color: #fff; }
        .rk.r3 { background: #a5b4fc; color: #312e81; }
        .views { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--text-muted); font-weight: 600; }
        .views svg.ico { width: 13px; height: 13px; }

        /* ===== 오늘의 이슈 TOP ===== */
        .hero-body { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; }
        .hero-feat {
            position: relative; display: flex; flex-direction: column; gap: 10px; padding: 20px 22px; border-radius: 12px; overflow: hidden;
            border: 1px solid #c7d2fe; background: linear-gradient(140deg, #eef2ff 0%, #ffffff 68%); text-decoration: none; color: inherit;
            transition: box-shadow .15s, border-color .15s;
        }
        .hero-feat:hover { border-color: var(--accent-blue); box-shadow: 0 8px 22px rgba(55, 48, 163, 0.12); }
        .feat-badge { align-self: flex-start; display: inline-flex; align-items: center; gap: 5px; background: var(--accent-blue); color: #fff; font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 999px; }
        .feat-badge svg.ico { width: 12px; height: 12px; }
        .feat-meta { font-size: 11.5px; color: var(--text-muted); font-weight: 600; }
        .feat-meta b { color: var(--text-secondary); font-weight: 800; }
        .feat-title { font-size: 21px; font-weight: 800; line-height: 1.45; letter-spacing: -0.5px; padding-right: 60px; }
        .feat-sum { font-size: 13px; color: var(--text-secondary); line-height: 1.75; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; padding-right: 40px; }
        .feat-foot { margin-top: auto; padding-top: 6px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .feat-mascot { position: absolute; right: 14px; top: 44px; width: 70px; height: auto; pointer-events: none; }
        .hero-list { display: flex; flex-direction: column; }
        .hero-row { display: flex; gap: 12px; align-items: flex-start; padding: 12px 4px; border-top: 1px solid var(--card-border); text-decoration: none; color: inherit; }
        .hero-row:first-child { border-top: none; padding-top: 2px; }
        .hero-row:hover .hr-title { color: var(--accent-blue); }
        .hr-title { font-size: 13.5px; font-weight: 700; line-height: 1.5; letter-spacing: -0.2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .hr-meta { display: flex; gap: 8px; align-items: center; margin-top: 4px; font-size: 11.5px; color: var(--text-muted); font-weight: 600; flex-wrap: wrap; }
        .hr-meta .src { color: var(--text-secondary); font-weight: 800; }

        /* ===== 오늘의 핵심 테마 TOP 5 ===== */
        .theme-list { display: flex; flex-direction: column; }
        .theme-row {
            display: grid; grid-template-columns: 34px minmax(0, 1.5fr) minmax(0, 1fr) 88px 74px; gap: 14px; align-items: center;
            padding: 12px 10px; border-top: 1px solid var(--card-border); border-radius: 8px; transition: background-color .12s;
        }
        .theme-row:first-child { border-top: none; }
        .theme-row:hover { background: var(--item-bg); }
        .theme-row.top { background: linear-gradient(90deg, #eef2ff 0%, #ffffff 85%); border-top-color: transparent; }
        .theme-row.top + .theme-row { border-top-color: transparent; }
        .th-name { font-size: 15px; font-weight: 800; letter-spacing: -0.3px; }
        .th-sum { font-size: 12px; color: var(--text-secondary); margin-top: 2px; line-height: 1.5; }
        .th-tags { display: flex; gap: 5px; flex-wrap: wrap; }
        .th-tags .chip { background: #fff; }
        .th-spark svg { width: 88px; height: 30px; display: block; }
        .th-stat { text-align: right; }
        .th-stat .rate { font-size: 14px; font-weight: 800; }
        .th-stat .cnt { font-size: 11px; color: var(--text-muted); font-weight: 600; margin-top: 2px; }

        /* ===== 실시간 금융 뉴스 ===== */
        .feed-list { display: flex; flex-direction: column; }
        .feed-item {
            display: grid; grid-template-columns: 74px minmax(0, 1fr) auto; gap: 14px; align-items: start; padding: 13px 8px;
            border-top: 1px solid var(--card-border); text-decoration: none; color: inherit; border-radius: 8px; transition: background-color .12s;
        }
        .feed-item:first-child { border-top: none; }
        .feed-item:hover { background: var(--item-bg); }
        .feed-item:hover .fi-title { color: var(--accent-blue); }
        .fi-time { font-size: 12px; color: var(--text-muted); font-weight: 700; padding-top: 2px; }
        .fi-title { font-size: 14.5px; font-weight: 700; line-height: 1.5; letter-spacing: -0.3px; }
        .fi-sum { font-size: 12.5px; color: var(--text-secondary); line-height: 1.65; margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .fi-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; font-size: 11.5px; color: var(--text-muted); font-weight: 600; padding-top: 2px; }
        .fi-meta .src { color: var(--text-secondary); font-weight: 800; }
        .more-wrap { display: flex; justify-content: center; padding: 12px 0 2px; }

        /* ===== 인기 기사 랭킹 ===== */
        .rank-period { font-size: 11.5px; color: var(--text-muted); font-weight: 600; margin: -4px 0 8px; }
        .rank-list { display: flex; flex-direction: column; }
        .rank-row { display: grid; grid-template-columns: 26px minmax(0, 1fr) 40px; gap: 10px; align-items: start; padding: 11px 4px; border-top: 1px solid var(--card-border); text-decoration: none; color: inherit; }
        .rank-row:first-child { border-top: none; }
        .rank-row:hover .rr-title { color: var(--accent-blue); }
        .rr-title { font-size: 13px; font-weight: 700; line-height: 1.5; letter-spacing: -0.2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .rr-meta { display: flex; gap: 8px; align-items: center; margin-top: 3px; font-size: 11px; color: var(--text-muted); font-weight: 600; }
        .rr-meta .src { color: var(--text-secondary); font-weight: 700; }
        .rr-chg { text-align: right; font-size: 11px; font-weight: 800; padding-top: 3px; white-space: nowrap; }
        .rr-chg.flat { color: var(--text-muted); font-weight: 600; }
        .rr-new { display: inline-block; background: var(--accent-blue); color: #fff; font-size: 9.5px; font-weight: 800; padding: 2px 5px; border-radius: 4px; }

        /* ===== 상태 화면 ===== */
        .sk { background: linear-gradient(90deg, #eef1f6 25%, #f7f9fc 37%, #eef1f6 63%); background-size: 400% 100%; animation: shimmer 1.3s ease infinite; border-radius: 6px; }
        @keyframes shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
        .sk-block { display: flex; flex-direction: column; gap: 10px; }
        .empty { text-align: center; padding: 34px 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .empty img { width: 120px; height: auto; }
        .empty .e-title { font-size: 15px; font-weight: 800; }
        .empty .e-desc { font-size: 12.5px; color: var(--text-secondary); line-height: 1.7; }

        /* 우측 상단 영역 (마이페이지 / 가상머니 / 로그아웃) */
        .header-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-shrink: 0; }
        .header-balance {
            display: flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 999px;
            background: linear-gradient(135deg, #fff7e3, #ffedbd); border: 1px solid #f0d888; color: #8a5f09;
            font-size: 12.5px; font-weight: 800; white-space: nowrap;
        }
        .header-balance svg { width: 15px; height: 15px; stroke: #b9800f; flex-shrink: 0; }
        .header-btn {
            display: flex; align-items: center; gap: 6px; padding: 7px 14px; border: 1px solid var(--card-border);
            border-radius: 999px; background-color: var(--card-bg); cursor: pointer; font-family: inherit;
            color: var(--text-primary); font-size: 12.5px; font-weight: 700; text-decoration: none; white-space: nowrap;
        }
        .header-btn svg { width: 15px; height: 15px; stroke: currentColor; flex-shrink: 0; }
        .header-btn-mypage:hover { border-color: var(--accent-blue); background-color: var(--hover-bg); color: var(--accent-blue); }
        .header-btn-logout { color: var(--text-muted); }
        .header-btn-logout:hover { border-color: #fca5a5; background-color: #fee2e2; color: #b91c1c; }
        @media (max-width: 560px) {
            .header-btn-label { display: none; }
            .header-btn { padding: 7px; }
            .header-balance { padding: 6px 10px; font-size: 11.5px; }
        }

        @media (max-width: 1100px) {
            .header-logo { display: none; }
            .news-grid { grid-template-columns: minmax(0, 1fr); grid-template-areas: "hero" "themes" "rank" "feed"; }
            .s-rank { position: static; }
        }
        @media (max-width: 760px) {
            .content-container { padding: 16px; }
            .card { padding: 16px 14px; }
            .hero-body { grid-template-columns: minmax(0, 1fr); }
            .feat-title { font-size: 18px; padding-right: 48px; }
            .theme-row { grid-template-columns: 30px minmax(0, 1fr) 64px; gap: 10px; }
            .th-tags, .th-spark { display: none; }
            .feed-item { grid-template-columns: minmax(0, 1fr); gap: 4px; }
            .fi-time { order: 2; padding-top: 0; }
            .fi-meta { flex-direction: row; align-items: center; order: 3; gap: 10px; }
        }

        /* ===== 실시간 종목(stocks.html) — 시안 토큰·카드·세그먼트 그대로 ===== */
        .stk-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; align-items: start; }
        .stk-tools { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 12px; }
        .stk-search { position: relative; flex: 1; min-width: 180px; max-width: 280px; }
        .stk-search input { width: 100%; padding: 8px 12px; border: 1px solid var(--card-border); border-radius: 8px; font: inherit; font-size: 13px; background: var(--card-bg); color: var(--text-primary); }
        .stk-sugg { position: absolute; top: 100%; left: 0; right: 0; z-index: 20; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 8px; margin-top: 4px; box-shadow: 0 6px 16px rgba(15,23,42,.08); }
        .stk-sugg button { display: flex; justify-content: space-between; width: 100%; padding: 8px 12px; border: none; background: none; font: inherit; font-size: 13px; cursor: pointer; color: var(--text-primary); text-align: left; }
        .stk-sugg button:hover { background: var(--hover-bg); }
        .stk-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .stk-table th { text-align: right; color: var(--text-secondary); font-weight: 700; font-size: 12px; padding: 8px 6px; border-bottom: 1px solid var(--card-border); }
        .stk-table td { text-align: right; padding: 9px 6px; border-bottom: 1px solid var(--card-border); white-space: nowrap; }
        .stk-table th:nth-child(2), .stk-table td:nth-child(2) { text-align: left; }
        .stk-table tbody tr { cursor: pointer; }
        .stk-table tbody tr:hover, .stk-table tbody tr.sel { background: var(--hover-bg); }
        .stk-name { font-weight: 700; color: var(--text-primary); }
        .stk-code { color: var(--text-secondary); font-size: 11.5px; margin-left: 6px; }
        .up { color: #c81e1e; } .down { color: #1d4ed8; } .flat { color: var(--text-secondary); }
        .stk-d-title { font-size: 18px; font-weight: 800; color: var(--text-primary); }
        .stk-d-price { font-size: 26px; font-weight: 800; margin-top: 6px; }
        .stk-d-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
        .stk-chart { width: 100%; height: 150px; margin: 14px 0 6px; }
        .stk-periods { display: flex; justify-content: flex-end; }
        .stk-facts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; font-size: 12.5px; margin-top: 12px; }
        .stk-facts div { display: flex; justify-content: space-between; border-bottom: 1px dashed var(--card-border); padding: 5px 0; }

    <script src="assets/oos/runtime.js"></script>
    <script>
// ============================================================
//  실시간 종목 — [백엔드 연동] 시안에 없던 화면이라 다른 화면의 헤더·카드·세그먼트를 그대로 썼다.
//  데이터: /market/stocks?sort= (순위) · /search/suggest (검색) · /stocks/{코드}/detail · /stocks/{코드}/ohlc
//  장중(평일 09:00~15:30)에는 30초마다 다시 받는다. 우리 서버 없이 열면 예시 데이터.
// ============================================================
const $ = (s) => document.querySelector(s);
const esc = OOS.esc, won = OOS.won;
const SORTS = [['value', '거래대금'], ['volume', '거래량'], ['marcap', '시가총액'], ['rise', '상승'], ['fall', '하락']];
const PERIODS = [['1M', '1개월'], ['3M', '3개월'], ['6M', '6개월'], ['1Y', '1년']];
const QS = new URLSearchParams(location.search);
const state = { mkt: QS.get('mkt') === 'us' ? 'us' : 'kr', sort: 'value', code: QS.get('code') || '', period: '3M' };
const MKTS = [['kr', '국내'], ['us', '해외(미국)']];
const API = {
    kr: { list: '/market/stocks', detail: (c) => `/stocks/${c}/detail`, ohlc: (c) => `/stocks/${c}/ohlc` },
    us: { list: '/overseas/list', detail: (c) => `/overseas/${c}/detail`, ohlc: (c) => `/overseas/${c}/ohlc` }
};
const isUS = () => state.mkt === 'us';
const nm = (r) => r.name_ko || r.name;
const money = (v) => (v == null ? '-' : isUS() ? '$' + Number(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : won(v));
const bigm = (v) => (isUS() ? (v == null ? '-' : '$' + (Number(v) >= 1e12 ? (v / 1e12).toFixed(2) + 'T' : Number(v) >= 1e9 ? (v / 1e9).toFixed(1) + 'B' : (v / 1e6).toFixed(0) + 'M')) : big(v));
const SAMPLE = [
    { ticker: '005930', name: '삼성전자', market: 'KOSPI', price: 71000, change_rate: 0.47, value: 267641458000, marcap: 423854561050000 },
    { ticker: '000660', name: 'SK하이닉스', market: 'KOSPI', price: 178400, change_rate: 2.04, value: 198400000000, marcap: 129880000000000 },
    { ticker: '035420', name: 'NAVER', market: 'KOSPI', price: 186200, change_rate: -0.76, value: 61200000000, marcap: 30250000000000 }
];
const SAMPLE_US = [
    { ticker: 'AAPL', name_ko: '애플', name: 'Apple Inc.', market: 'NASDAQ', price: 256.8, change_rate: -0.38, value: 13092357873, marcap: 3800640000000 },
    { ticker: 'NVDA', name_ko: '엔비디아', name: 'NVIDIA Corp.', market: 'NASDAQ', price: 187.2, change_rate: 1.12, value: 41200000000, marcap: 4560000000000 }
];
const sample = () => (isUS() ? SAMPLE_US : SAMPLE);
let listSeq = 0, detailSeq = 0, suggSeq = 0, suggTimer = null;

const signCls = (v) => (v > 0 ? 'up' : v < 0 ? 'down' : 'flat');
const pct = (v) => `${v > 0 ? '+' : ''}${Number(v || 0).toFixed(2)}%`;
function big(n) {
    n = Number(n) || 0;
    if (n >= 1e12) return (n / 1e12).toFixed(1) + '조';
    if (n >= 1e8) return Math.round(n / 1e8).toLocaleString('ko-KR') + '억';
    return won(n);
}

function renderSorts() {
    $('#mktGroup').innerHTML = MKTS.map(([k, label]) =>
        `<button class="seg${state.mkt === k ? ' active' : ''}" type="button" data-act="mkt" data-k="${k}" aria-pressed="${state.mkt === k}">${label}</button>`).join('');
    $('#sortGroup').innerHTML = SORTS.map(([k, label]) =>
        `<button class="seg${state.sort === k ? ' active' : ''}" type="button" data-act="sort" data-k="${k}" aria-pressed="${state.sort === k}">${label}</button>`).join('');
}

async function loadList() {
    renderSorts();
    const seq = ++listSeq;
    let d;
    if (!OOS.online) d = { items: sample(), sample: true };
    else {
        try { d = await OOS.api(`${API[state.mkt].list}?sort=${state.sort}&limit=50`); }
        catch (e) { if (seq === listSeq) $('#stkBody').innerHTML = `<tr><td colspan="6" class="stk-empty">순위를 불러오지 못했어요 — ${esc(e.message)}</td></tr>`; return; }
    }
    if (seq !== listSeq) return;
    const items = d.items || [];
    const st = d.status || {};
    $('#sampleBadge').hidden = !(d.sample || st.source === 'gen' || d.source === 'gen');
    $('#updText').textContent = st.live ? '● 실시간' : d.as_of ? `${d.as_of.slice(5).replace('-', '.')} 종가 기준` : '';
    $('#stkBody').innerHTML = items.length ? items.map((r, i) => `
        <tr data-act="pick" data-code="${esc(r.ticker)}" class="${r.ticker === state.code ? 'sel' : ''}">
            <td>${i + 1}</td>
            <td><span class="stk-name">${esc(nm(r))}</span><span class="stk-code">${esc(r.ticker)}</span></td>
            <td>${money(r.price)}</td>
            <td class="${signCls(r.change_rate)}">${pct(r.change_rate)}</td>
            <td class="stk-hide-m">${bigm(r.value)}</td>
            <td class="stk-hide-m">${bigm(r.marcap ?? r.market_cap)}</td>
        </tr>`).join('') : '<tr><td colspan="6" class="stk-empty">아직 시세 데이터가 없어요 — 첫 수집(run.py real) 뒤에 보여요</td></tr>';
    if (!state.code && items.length) pick(items[0].ticker, false);
}

function chart(series) {
    const c = series.map((b) => Number(b.close)).filter((v) => v > 0);
    if (c.length < 2) return '<div class="stk-empty">차트 데이터가 없어요</div>';
    const W = 320, H = 150, min = Math.min(...c), max = Math.max(...c), span = max - min || 1;
    const pts = c.map((v, i) => `${((i / (c.length - 1)) * W).toFixed(1)},${(H - 8 - ((v - min) / span) * (H - 16)).toFixed(1)}`).join(' ');
    const color = c[c.length - 1] >= c[0] ? '#dc2626' : '#2563eb';
    return `<svg class="stk-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="종가 추이"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}

async function pick(code, scroll = true) {
    state.code = code;
    document.querySelectorAll('#stkBody tr').forEach((tr) => tr.classList.toggle('sel', tr.dataset.code === code));
    history.replaceState(null, '', `stocks.html?mkt=${state.mkt}&code=${encodeURIComponent(code)}`);
    const box = $('#stkDetail'), seq = ++detailSeq;
    if (!OOS.online) {
        const s = sample().find((x) => x.ticker === code) || sample()[0];
        box.innerHTML = detailHtml({ ...s, fundamentals: {} }, []);
        return;
    }
    box.innerHTML = '<div class="stk-empty">불러오는 중…</div>';
    let d, o;
    try { [d, o] = await Promise.all([OOS.api(API[state.mkt].detail(encodeURIComponent(code))), OOS.api(`${API[state.mkt].ohlc(encodeURIComponent(code))}?period=${state.period}`)]); }
    catch (e) { if (seq === detailSeq) box.innerHTML = `<div class="stk-empty">${esc(e.message)}</div>`; return; }
    if (seq !== detailSeq) return;
    box.innerHTML = detailHtml(d, (o && o.series) || []);
    if (scroll && window.innerWidth <= 960) box.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function detailHtml(d, series) {
    const f = d.fundamentals || {};
    const fact = (k, v) => (v == null || v === '' ? '' : `<div><span>${k}</span><span>${v}</span></div>`);
    return `
        <div class="stk-d-title">${esc(nm(d))} <span class="stk-code">${esc(d.ticker)} · ${esc(d.market || d.exchange || '')}</span></div>
        <div class="stk-d-price ${signCls(d.change_rate)}">${isUS() ? money(d.price) : won(d.price) + '원'}</div>
        <div class="${signCls(d.change_rate)}" style="font-size:13px;font-weight:700">${d.change != null ? (d.change > 0 ? '▲ ' : d.change < 0 ? '▼ ' : '') + money(Math.abs(d.change)) + ' ' : ''}(${pct(d.change_rate)})${isUS() && d.price_krw ? ` · 약 ${won(d.price_krw)}원` : ''}</div>
        <div class="stk-d-sub">${d.live ? '● 실시간' : d.session_date ? esc(d.session_date) + ' 종가' : ''}${d.sector ? ' · ' + esc(d.sector) : ''}</div>
        ${chart(series)}
        <div class="stk-periods"><div class="seg-group" role="group" aria-label="차트 기간">${PERIODS.map(([k, l]) =>
            `<button class="seg${state.period === k ? ' active' : ''}" type="button" data-act="period" data-k="${k}" aria-pressed="${state.period === k}">${l}</button>`).join('')}</div></div>
        <div class="stk-facts">
            ${fact('시가', f.open != null ? money(f.open) : null)}${fact('고가', f.high != null ? money(f.high) : null)}
            ${fact('저가', f.low != null ? money(f.low) : null)}${fact('거래대금', f.value != null ? bigm(f.value) : null)}
            ${fact('시가총액', f.market_cap != null ? bigm(f.market_cap) : d.marcap ? bigm(d.marcap) : null)}${fact('PER', f.per != null ? f.per + '배' : null)}
            ${fact('PBR', f.pbr != null ? f.pbr + '배' : null)}${fact('배당수익률', f.dividend_yield != null ? f.dividend_yield + '%' : null)}
            ${fact('52주 최고', f.high_52w != null ? money(f.high_52w) : null)}${fact('52주 최저', f.low_52w != null ? money(f.low_52w) : null)}
        </div>`;
}

// 검색(자동완성) — 늦게 온 응답은 버린다
function hideSugg() { $('#stkSugg').hidden = true; }
$('#stkSearch').addEventListener('input', (e) => {
    clearTimeout(suggTimer);
    const q = e.target.value.trim();
    if (!q) { hideSugg(); return; }
    suggTimer = setTimeout(async () => {
        const seq = ++suggSeq;
        let items = [];
        if (!OOS.online) items = [...SAMPLE, ...SAMPLE_US].filter((s) => nm(s).includes(q) || s.ticker.includes(q.toUpperCase())).map((s) => ({ ...s, type: SAMPLE_US.includes(s) ? 'us' : 'kr' }));
        else { try { items = (await OOS.api(`/search/suggest?kind=all&prefer=${state.mkt}&limit=8&q=` + encodeURIComponent(q))).items || []; } catch (err) { items = []; } }
        if (seq !== suggSeq) return;
        const box = $('#stkSugg');
        box.innerHTML = items.length ? items.map((s) => `<button type="button" data-act="pick" data-code="${esc(s.ticker)}" data-mkt="${s.type === 'us' ? 'us' : 'kr'}"><span>${esc(nm(s))} <span class="stk-code">${esc(s.ticker)}${s.type === 'us' ? ' · 해외' : ''}</span></span><span class="${signCls(s.change_rate)}">${s.price != null ? (s.type === 'us' ? '$' + Number(s.price).toFixed(2) : won(s.price)) : ''}</span></button>`).join('')
            : '<div class="stk-empty" style="padding:10px">찾는 종목이 없어요</div>';
        box.hidden = false;
    }, 200);
});
$('#stkSearch').addEventListener('keydown', (e) => {
    if (e.key === 'Escape') hideSugg();
    if (e.key === 'Enter' && !e.isComposing) { const b = $('#stkSugg button'); if (b) b.click(); }
});

document.addEventListener('click', (e) => {
    if (!e.target.closest('.stk-search')) hideSugg();
    const el = e.target.closest('[data-act]'); if (!el) return;
    const act = el.dataset.act;
    if (act === 'sort') { state.sort = el.dataset.k; loadList(); }
    else if (act === 'mkt') { if (state.mkt !== el.dataset.k) { state.mkt = el.dataset.k; state.code = ''; loadList(); } }
    else if (act === 'pick') {
        hideSugg(); $('#stkSearch').value = '';
        const m = el.dataset.mkt;
        if (m && m !== state.mkt) { state.mkt = m; state.code = el.dataset.code; loadList().then(() => pick(el.dataset.code)); }
        else pick(el.dataset.code);
    }
    else if (act === 'period') { state.period = el.dataset.k; pick(state.code, false); }
});
const sidebar = $('#sidebar');
$('#toggleBtn').addEventListener('click', () => sidebar.classList.toggle('collapsed'));
if (window.innerWidth <= 760) sidebar.classList.add('collapsed');

loadList().then(() => { if (state.code) pick(state.code, false); });
// 장중에는 30초마다 순위·선택 종목 갱신(화면이 보일 때만)
setInterval(() => {
    if (!OOS.online || document.hidden) return;
    const t = new Date(Date.now() + 9 * 3600e3), d = t.getUTCDay(), m = t.getUTCHours() * 60 + t.getUTCMinutes();
    const open = isUS() ? ((d >= 1 && d <= 5 && m >= 1350) || (d >= 2 && d <= 6 && m <= 360)) : (d >= 1 && d <= 5 && m >= 540 && m <= 935);
    if (open) { loadList(); if (state.code) pick(state.code, false); }
}, 30000);
window.__S = { state, loadList, pick };

// 우측 상단 잔액·로그인/로그아웃은 공용 런타임(assets/oos/runtime.js)이 채운다
    </script>
