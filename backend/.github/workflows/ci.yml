# CI — 푸시·PR 마다 작업을 나눠 돌린다(하나가 실패해도 나머지 결과는 보이게).
#   lint            ruff · shellcheck · 화면 스크립트 문법(node --check) · 잠금 파일 = requirements.txt
#   test            PostgreSQL 16 위 pytest 전체(서버 시간대 KST·UTC) — 해시 고정 설치, 실제 복원 훈련·배포 정책 시험 포함
#   least-privilege deploy/sql/roles.sql 로 계정을 나눈 DB 에서 앱 계정(oos_app: DDL 없음·RLS 적용)으로 pytest 전체 + 권한 점검
#   security        의존성 취약점(pip-audit, 잠금 파일) · 정적 분석(bandit) · 숨은 문자 · 운영 견본 보안 기준선 · SBOM(CycloneDX)
#   image           운영 이미지 빌드(해시 고정 설치) → 읽기 전용·권한 없음으로 띄워 /health · compose 운영 오버레이 설정 검증
#   e2e             실제 크로미움 — 쿠키 세션·CSRF·토큰 갱신·추가 인증·SSE·CSP/Trusted Types·접근성(axe)
#
# 공급망: 액션은 태그가 아니라 커밋 SHA 로 고정(태그는 옮겨질 수 있다), 도구 버전 고정, 토큰은 읽기 권한만·저장소에 남기지 않음.
# 비밀값은 쓰지 않는다 — 테스트는 외부 API 를 막아 두고(conftest) 키 없이 돈다. DB 비밀번호는 CI 안에서만 쓰는 값.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * 0"                          # 매주 월요일 03:17(KST) — 새로 공개된 취약점(pip-audit)·E2E

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PY: "3.12"

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: {python-version: "${{ env.PY }}"}
      - run: pip install "ruff==0.15.11" "shellcheck-py==0.11.0.1"
      - run: ruff check . --output-format github
      - run: shellcheck -S warning deploy/*.sh deploy/backup/*.sh deploy/pki/*.sh tools/*.sh
      - run: python tools/check_lock.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with: {node-version: "20"}
      - run: python tools/check_frontend.py

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        tz: ["Asia/Seoul", "UTC"]
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: postgres}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TZ: ${{ matrix.tz }}
      # 시험 계정은 슈퍼유저가 아니다 — 슈퍼유저는 행 수준 보안(RLS)을 늘 건너뛰어 행 격리 시험이 거짓으로 실패한다
      TEST_DATABASE_URL: postgresql+psycopg://oos:oos@localhost:5432/outofstock_test
      DATABASE_URL: postgresql+psycopg://oos:oos@localhost:5432/outofstock_test
      # 실제 복원 훈련(tests/test_dr.py) — 격리 DB 를 새로 만들 수 있는 계정(서비스 컨테이너의 관리자)
      DR_TEST_ADMIN_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: {python-version: "${{ env.PY }}", cache: pip, cache-dependency-path: requirements.lock}
      - name: pg_dump·pg_restore(서버와 같은 16) · age(백업 암호화)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends postgresql-client-16 age
      - name: 시험 계정 oos(슈퍼유저 아님)와 시험 DB
        env: {PGPASSWORD: postgres}
        run: >-
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1
          -c "CREATE ROLE oos LOGIN PASSWORD 'oos' NOSUPERUSER NOCREATEDB NOBYPASSRLS"
          -c "CREATE DATABASE outofstock_test OWNER oos"
      - name: 의존성(운영과 같은 해시 고정 목록) + 시험 도구
        run: |
          pip install --require-hashes --no-deps -r requirements.lock
          pip install "pytest>=8,<10"
          pip check
      - name: pytest (${{ matrix.tz }})
        run: python -m pytest -q -p no:cacheprovider -rfs --durations=10 --junitxml=pytest-report.xml
      - name: 실패한 시험을 주석으로(로그를 열지 않아도 커밋 화면·API 에서 보이게)
        if: failure()
        run: python tools/ci_annotate.py junit pytest-report.xml

  least-privilege:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: outofstock_lp}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d outofstock_lp"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # 스키마 생성·시험 간 초기화만 소유자, 앱 코드는 전부 oos_app 으로(운영과 같은 분리 — conftest.py)
      TEST_DATABASE_URL: postgresql+psycopg://oos_owner:owner_ci@localhost:5432/outofstock_lp
      TEST_APP_DATABASE_URL: postgresql+psycopg://oos_app:app_ci@localhost:5432/outofstock_lp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: {python-version: "${{ env.PY }}", cache: pip, cache-dependency-path: requirements.lock}
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends postgresql-client-16 age
      - run: |
          pip install --require-hashes --no-deps -r requirements.lock
          pip install "pytest>=8,<10"
      - name: 계정 분리(운영과 같은 deploy/sql/roles.sql)
        env: {PGPASSWORD: postgres}
        run: >-
          psql -h localhost -U postgres -d outofstock_lp -v ON_ERROR_STOP=1
          -v owner_pw="'owner_ci'" -v app_pw="'app_ci'" -v ro_pw="'ro_ci'" -v backup_pw="'backup_ci'"
          -f deploy/sql/roles.sql
      - name: pytest — 앱 계정(oos_app)
        run: python -m pytest -q -p no:cacheprovider -rfs --junitxml=pytest-report.xml
      - name: 실패한 시험을 주석으로
        if: failure()
        run: python tools/ci_annotate.py junit pytest-report.xml
      - name: 권한 점검(슈퍼유저·DDL·RLS 우회·감사 로그 수정 없음)
        env: {DATABASE_URL: "postgresql+psycopg://oos_app:app_ci@localhost:5432/outofstock_lp"}
        run: python tools/db_roles_check.py --strict

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: {python-version: "${{ env.PY }}", cache: pip, cache-dependency-path: requirements.lock}
      - run: |
          pip install --require-hashes --no-deps -r requirements.lock
          pip install "pip-audit==2.10.1" "bandit==1.9.4" "cyclonedx-bom==7.5.0"
      - name: 취약점(잠금 파일) · bandit · 숨은 문자
        run: bash tools/security_scan.sh
      - name: 운영 견본(env.prod.example) 보안 기준선 + 비밀값 없음
        run: python tools/security_check.py --template env.prod.example
      - name: SBOM(CycloneDX 1.6) — 운영 이미지에 들어가는 패키지 목록
        run: cyclonedx-py requirements requirements.lock --of JSON --output-reproducible -o sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with: {name: sbom, path: sbom.cdx.json, retention-days: 90}

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: oos, POSTGRES_PASSWORD: oos, POSTGRES_DB: outofstock}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oos -d outofstock"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}
      - name: 운영 이미지 빌드(해시 고정 설치·루트 아닌 계정·pip 없음)
        run: |
          docker build --target runtime -t outofstock/app:ci .
          docker build --target backup -t outofstock/backup:ci .
      - name: 읽기 전용·capability 없음·권한 상승 금지로 기동 → /health
        run: |
          {
            DB=postgresql+psycopg://oos:oos@127.0.0.1:5432/outofstock
            docker run --rm --network host -e DATABASE_URL="$DB" outofstock/app:ci python run.py initdb
            docker run -d --name app --network host --read-only --tmpfs /tmp --cap-drop ALL \
              --security-opt no-new-privileges -e DATABASE_URL="$DB" outofstock/app:ci
            for _ in $(seq 1 40); do curl -fsS -o /dev/null http://127.0.0.1:8000/health && break; sleep 2; done
            curl -fsS http://127.0.0.1:8000/health
            test "$(docker exec app id -u)" = 10001
            if docker exec app sh -c 'touch /app/x' 2>/dev/null; then echo "코드 폴더에 쓸 수 있다"; exit 1; fi
            if docker exec app sh -c 'command -v pip' >/dev/null; then echo "실행 이미지에 pip 가 있다"; exit 1; fi
            docker run --rm outofstock/backup:ci sh -c 'pg_dump --version && age --version'
          } 2>&1 | tee image-step.log
      - name: 실패 원인을 주석으로(기동 단계 로그·앱 로그)
        if: failure()
        run: |
          docker logs app > app.log 2>&1 || true
          python3 tools/ci_annotate.py tail image-step.log "이미지 기동 단계 로그"
          python3 tools/ci_annotate.py tail app.log "앱 컨테이너 로그"
      - name: compose 운영 오버레이 설정 검증(합쳐진 결과 — 필수 비밀번호·망·권한)
        run: |
          cp env.prod.example .env
          printf 'POSTGRES_PASSWORD=x1\nOOS_OWNER_PASSWORD=x2\nOOS_APP_PASSWORD=x3\nOOS_RO_PASSWORD=x4\nOOS_BACKUP_PASSWORD=x5\n' > .env.db
          docker compose --env-file .env --env-file .env.db -f docker-compose.yml -f docker-compose.prod.yml \
            --profile full --profile ops config -q
      - if: always()
        run: docker logs app 2>&1 | tail -50 || true

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: oos, POSTGRES_PASSWORD: oos, POSTGRES_DB: outofstock}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oos -d outofstock"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://oos:oos@localhost:5432/outofstock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: {python-version: "${{ env.PY }}", cache: pip, cache-dependency-path: requirements.lock}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with: {node-version: "20"}
      - run: |
          pip install --require-hashes --no-deps -r requirements.lock
          pip install "playwright==1.63.0"
          python -m playwright install --with-deps chromium
          npm install --no-save --no-audit --no-fund "axe-core@4.10.2"
      - name: 서버(데모 데이터) 기동
        run: |
          python run.py initdb
          python run.py demo
          nohup python -m uvicorn app.api:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          for _ in $(seq 1 40); do curl -fsS -o /dev/null http://127.0.0.1:8000/health && break; sleep 2; done
      - name: 화면 흐름 E2E(실제 크로미움 · axe)
        shell: bash
        run: python tools/e2e_web.py --base http://127.0.0.1:8000 --axe node_modules/axe-core/axe.min.js --shots e2e-shots 2>&1 | tee e2e.log
      - name: 실패 원인을 주석으로(실패 항목·출력 끝부분·서버 4xx/5xx)
        if: failure()
        run: |
          grep -E '^FAIL|Traceback|Error' e2e.log > e2e-fail.log || true
          grep -E '" [45][0-9][0-9] |Traceback|ERROR' uvicorn.log > server-err.log || true
          python3 tools/ci_annotate.py tail e2e-fail.log "E2E 실패 항목"
          python3 tools/ci_annotate.py tail e2e.log "E2E 출력 끝부분"
          python3 tools/ci_annotate.py tail server-err.log "서버 4xx·5xx·오류"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with: {name: e2e, path: "e2e-shots\ne2e.log\nuvicorn.log", retention-days: 14, if-no-files-found: ignore}
