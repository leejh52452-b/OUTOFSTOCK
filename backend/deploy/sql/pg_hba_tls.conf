# DB_TLS=on 일 때의 접속 규칙(compose 운영 오버레이: -c hba_file=/etc/oos/pg_hba_tls.conf)
# 위에서부터 처음 맞는 줄이 적용된다.
#   · 컨테이너 안 유닉스 소켓(관리 작업: 진입점·deploy.sh 의 역할 설정)은 공식 이미지 기본대로
#   · TCP 는 TLS + SCRAM 만 — 평문 TCP 는 계정·비밀번호가 맞아도 거부(같은 호스트 내부망이라도 '망을 믿지 않는다')
# TYPE      DATABASE  USER  ADDRESS  METHOD
local       all       all            trust
hostnossl   all       all   all      reject
hostssl     all       all   all      scram-sha-256
