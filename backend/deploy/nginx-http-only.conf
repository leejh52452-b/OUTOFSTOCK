# [개발·임시용] HTTP 만 쓰는 리버스 프록시 — 운영은 deploy/nginx.conf(TLS·mTLS)를 쓴다. 쿠키 Secure·HSTS 가 꺼진다.
# 설치:
#   sudo cp deploy/nginx-http-only.conf /etc/nginx/sites-available/outofstock
#   sudo ln -sf /etc/nginx/sites-available/outofstock /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   bash deploy/vm.sh units          # 앱을 127.0.0.1 로 다시 묶는다(nginx 를 건너뛴 직접 접속 차단)
# Docker 경로는 docker-compose.prod.yml 의 edge(deploy/nginx/compose-http.conf)를 쓴다.
#
# TLS 가 없으므로 관리 기기 인증(mTLS)도 없다 — 인증서 확인 헤더를 'NONE' 으로 덮어써 위조를 막는다
# (앱 .env 에 ADMIN_REQUIRE_CLIENT_CERT=true 면 관리 기능은 이 경로로 쓸 수 없다 = 의도한 동작).

limit_req_zone  $binary_remote_addr zone=oos_auth:10m rate=10r/m;     # 로그인·가입·갱신·추가 인증
limit_req_zone  $binary_remote_addr zone=oos_api:10m  rate=30r/s;
limit_conn_zone $binary_remote_addr zone=oos_conn:10m;

upstream oos_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;                     # IPv6 를 쓰는 서버면 'listen [::]:80;' 추가(IPv6 를 끈 VM 에서 넣으면 nginx 가 못 뜬다)
    server_name _;                 # 도메인이 있으면 여기에 기입 (예: oos.example.ac.kr)
    server_tokens off;

    client_max_body_size    1m;
    client_body_timeout     15s;
    client_header_timeout   15s;
    keepalive_timeout       65s;
    send_timeout            30s;
    limit_conn              oos_conn 60;
    limit_req_status        429;
    limit_conn_status       429;

    # 클라이언트가 보낸 X-Forwarded-For·X-Request-ID·인증서 헤더는 '덧붙이지 않고 덮어쓴다'(위조 차단)
    # ($proxy_add_x_forwarded_for 를 쓰면 가짜 IP 를 앞에 넣어 로그인·가입 시도 제한을 피할 수 있다)
    proxy_http_version 1.1;
    # Host 는 포트까지 그대로($http_host) — $host 는 포트를 떼어, 80·443 이 아닌 포트(예: HTTP_PORT=8000)로 서비스하면
    # 브라우저 Origin(http://주소:8000)과 앱이 보는 출처(http://주소)가 달라 웹 로그인·변경 요청이 모두 403(csrf_failed)이었다.
    proxy_set_header   Host                    $http_host;
    proxy_set_header   X-Forwarded-For         $remote_addr;
    proxy_set_header   X-Forwarded-Proto       $scheme;
    proxy_set_header   X-Request-ID            $request_id;
    proxy_set_header   X-Client-Cert-Verified  "NONE";
    proxy_set_header   Connection              "";
    proxy_read_timeout 60s;

    location ~ /\.                     { deny all; }                    # 숨김 파일(.env·.git)
    location ~ ^/(docs|redoc|openapi\.json) { return 404; }              # API 문서는 운영에서 숨김(앱도 DOCS_ENABLED=false)

    location ~ ^/auth/(login|register|refresh|step-up)$ {
        limit_req zone=oos_auth burst=5 nodelay;
        proxy_pass http://oos_app;
    }

    location = /events {                                                  # 실시간 알림(SSE) — 버퍼링 없이, 오래 연결
        proxy_pass http://oos_app;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        limit_req zone=oos_api burst=20 nodelay;
    }

    # 화면 자산(web/assets·web/images) — 캐시 정책은 앱이 정한다(그림 하루 · 스크립트는 매번 확인해 배포 즉시 새 코드).
    # 화면 한 장이 그림·스크립트를 여러 개 받으므로 API 용 요청 제한은 걸지 않는다(예전 /static/ 과 같은 취급)
    location ~ ^/(assets|images)/ {
        proxy_pass http://oos_app;
    }

    location / {
        limit_req zone=oos_api burst=60 nodelay;
        proxy_pass http://oos_app;
    }
}
