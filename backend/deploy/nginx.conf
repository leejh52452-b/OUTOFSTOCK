# OUTOFSTOCK 리버스 프록시 — 제로트러스트 경계(TLS 종단·관리 기기 인증·1차 시도 제한·요청 ID)
#
# 설치(우분투):
#   sudo bash deploy/pki/make-pki.sh /etc/nginx/tls          # 사설 CA·서버 인증서·관리 기기 인증서(공인 인증서가 있으면 서버 것만 교체)
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/outofstock
#   sudo ln -sf /etc/nginx/sites-available/outofstock /etc/nginx/sites-enabled/ && sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# 앱은 외부에 직접 노출하지 않는다 — VM: 이 파일을 깐 뒤 'bash deploy/vm.sh units'(앱을 127.0.0.1 로 다시 묶음)
#                                     Docker: docker-compose.prod.yml 은 edge(nginx 컨테이너)만 포트를 연다
# 앱 .env: COOKIE_SECURE=true · ADMIN_REQUIRE_CLIENT_CERT=true · SECURITY_HSTS=true · DOCS_ENABLED=false
#
# 계층별 역할(앱과 겹치게 — 다층 방어)
#   nginx : TLS 1.2/1.3 · 요청 크기·시간 제한 · IP 당 요청률(로그인 계열은 분당 10회) · /admin 은 관리 기기 인증서(mTLS) 필수
#   앱    : 세션·정책(PDP/PEP)·CSRF·계정 잠금·시도 제한(공유 저장소)·감사·이상 탐지

limit_req_zone  $binary_remote_addr zone=oos_auth:10m rate=10r/m;     # 로그인·가입·갱신·추가 인증
limit_req_zone  $binary_remote_addr zone=oos_api:10m  rate=30r/s;
limit_conn_zone $binary_remote_addr zone=oos_conn:10m;

upstream oos_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;                                       # IPv6 를 쓰는 서버면 'listen [::]:80;' 추가(IPv6 를 끈 VM 에서 넣으면 nginx 가 못 뜬다)
    server_name _;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }     # 공인 인증서(Let's Encrypt) 발급용
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;                            # 우분투 22.04/24.04 의 nginx(1.18·1.24) 문법 — 1.25+ 는 'http2 on;'
                                                     # IPv6: 'listen [::]:443 ssl http2;' 추가
    server_name _;                                   # 도메인이 있으면 기입(예: oos.example.ac.kr)
    server_tokens off;

    # ── TLS ── (KISA·금융권 권고: TLS 1.2 이상, 전방향 안전성(ECDHE) + AEAD 암호만)
    ssl_certificate         /etc/nginx/tls/server.crt;
    ssl_certificate_key     /etc/nginx/tls/server.key;
    ssl_protocols           TLSv1.2 TLSv1.3;
    ssl_ciphers             ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache       shared:OOS_TLS:10m;
    ssl_session_timeout     1d;
    ssl_session_tickets     off;                     # 티켓 키가 유출돼도 지난 세션을 복호화할 수 없게

    # ── 관리 기기 인증(mTLS) — 사설 CA 가 발급한 클라이언트 인증서가 있는 기기만 /admin 에 들어간다 ──
    ssl_client_certificate  /etc/nginx/tls/admin-ca.crt;
    ssl_verify_client       optional;                # 일반 사용자는 인증서 없이, /admin 만 아래에서 강제
    ssl_verify_depth        2;

    # ── 요청 제한(느린 요청·큰 본문·연결 폭주) ──
    client_max_body_size    1m;
    client_body_timeout     15s;
    client_header_timeout   15s;
    keepalive_timeout       65s;
    send_timeout            30s;
    limit_conn              oos_conn 60;
    limit_req_status        429;
    limit_conn_status       429;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 공통 프록시 헤더 — 클라이언트가 보낸 X-Forwarded-For·X-Request-ID·인증서 헤더는 '덮어쓴다'(위조 차단)
    proxy_http_version 1.1;
    # Host 는 포트까지 그대로($http_host) — $host 는 포트를 떼어, 80·443 이 아닌 포트(예: HTTP_PORT=8000)로 서비스하면
    # 브라우저 Origin(http://주소:8000)과 앱이 보는 출처(http://주소)가 달라 웹 로그인·변경 요청이 모두 403(csrf_failed)이었다.
    proxy_set_header   Host                    $http_host;
    proxy_set_header   X-Forwarded-For         $remote_addr;
    proxy_set_header   X-Forwarded-Proto       $scheme;
    proxy_set_header   X-Request-ID            $request_id;
    proxy_set_header   X-Client-Cert-Verified  $ssl_client_verify;
    proxy_set_header   Connection              "";
    proxy_read_timeout 60s;

    location ~ /\.                     { deny all; }                    # 숨김 파일(.env·.git)
    location ~ ^/(docs|redoc|openapi\.json) { return 404; }              # API 문서는 운영에서 숨김(앱도 DOCS_ENABLED=false)

    location ~ ^/auth/(login|register|refresh|step-up)$ {
        limit_req zone=oos_auth burst=5 nodelay;
        proxy_pass http://oos_app;
    }

    location /admin/ {
        if ($ssl_client_verify != SUCCESS) { return 403; }               # 관리 기기 인증서 없으면 앱까지 가지도 않는다
        limit_req zone=oos_api burst=10 nodelay;
        proxy_pass http://oos_app;
    }

    # 화면 자산(web/assets·web/images) — 캐시 정책은 앱이 정한다(그림 하루 · 스크립트는 매번 확인해 배포 즉시 새 코드).
    # 화면 한 장이 그림·스크립트를 여러 개 받으므로 API 용 요청 제한은 걸지 않는다(예전 /static/ 과 같은 취급)
    location ~ ^/(assets|images)/ {
        proxy_pass http://oos_app;
    }

    # 실시간 알림(SSE, EventSource) — 버퍼링 없이 바로 흘려보내고 오래 연결을 유지한다.
    # 앱이 20초마다 keep-alive 주석을 보내고 30분이면 스스로 끊어 재접속시킨다(세션 만료·폐기를 다시 확인).
    location = /events {
        proxy_pass http://oos_app;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        limit_req zone=oos_api burst=20 nodelay;
    }

    location / {
        limit_req zone=oos_api burst=60 nodelay;
        proxy_pass http://oos_app;
    }
}
