# compose 운영 오버레이의 edge(nginx-unprivileged, uid 101) — TLS 판(EDGE_MODE=tls). 인증서: deploy/tls/edge/
#   server.crt·server.key(공인 또는 make-pki.sh 자체 서명) · admin-ca.crt(관리 기기 CA — /admin 은 이 CA 가 발급한 기기만)
limit_req_zone  $binary_remote_addr zone=oos_auth:10m rate=10r/m;
limit_req_zone  $binary_remote_addr zone=oos_api:10m  rate=30r/s;
limit_conn_zone $binary_remote_addr zone=oos_conn:10m;

upstream oos_app {
    server app:8000;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate         /etc/nginx/tls/server.crt;
    ssl_certificate_key     /etc/nginx/tls/server.key;
    ssl_protocols           TLSv1.2 TLSv1.3;
    ssl_ciphers             ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache       shared:OOS_TLS:10m;
    ssl_session_timeout     1d;
    ssl_session_tickets     off;

    ssl_client_certificate  /etc/nginx/tls/admin-ca.crt;
    ssl_verify_client       optional;
    ssl_verify_depth        2;

    client_max_body_size    1m;
    client_body_timeout     15s;
    client_header_timeout   15s;
    keepalive_timeout       65s;
    send_timeout            30s;
    limit_conn              oos_conn 60;
    limit_req_status        429;
    limit_conn_status       429;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    proxy_http_version 1.1;
    # Host 는 포트까지 그대로($http_host) — $host 는 포트를 떼어, 80·443 이 아닌 포트(예: HTTP_PORT=8000)로 서비스하면
    # 브라우저 Origin(http://주소:8000)과 앱이 보는 출처(http://주소)가 달라 웹 로그인·변경 요청이 모두 403(csrf_failed)이었다.
    proxy_set_header   Host                    $http_host;
    proxy_set_header   X-Forwarded-For         $remote_addr;
    proxy_set_header   X-Forwarded-Proto       $scheme;
    proxy_set_header   X-Request-ID            $request_id;
    proxy_set_header   X-Client-Cert-Verified  $ssl_client_verify;
    proxy_set_header   Connection              "";
    proxy_read_timeout 60s;

    location ~ /\.                          { deny all; }
    location ~ ^/(docs|redoc|openapi\.json) { return 404; }

    location ~ ^/auth/(login|register|refresh|step-up)$ {
        limit_req zone=oos_auth burst=5 nodelay;
        proxy_pass http://oos_app;
    }
    location /admin/ {
        if ($ssl_client_verify != SUCCESS) { return 403; }
        limit_req zone=oos_api burst=10 nodelay;
        proxy_pass http://oos_app;
    }
    location = /events {
        proxy_pass http://oos_app;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        limit_req zone=oos_api burst=20 nodelay;
    }
    # 화면 자산(web/assets·web/images) — 캐시 정책은 앱이 정한다(그림 하루 · 스크립트는 매번 확인해 배포 즉시 새 코드).
    # 화면 한 장이 그림·스크립트를 여러 개 받으므로 API 용 요청 제한은 걸지 않는다(예전 /static/ 과 같은 취급)
    location ~ ^/(assets|images)/ {
        proxy_pass http://oos_app;
    }

    location / {
        limit_req zone=oos_api burst=60 nodelay;
        proxy_pass http://oos_app;
    }
}
