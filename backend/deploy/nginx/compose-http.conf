# compose 운영 오버레이의 edge(nginx-unprivileged, uid 101) — HTTP 판(학교 VPN 안 등 TLS 없이 시작할 때).
# 인증서가 생기면 EDGE_MODE=tls(compose-tls.conf)로 바꾼다. 앱은 web 내부망에만 있어 이 프록시를 거쳐야만 닿는다.
limit_req_zone  $binary_remote_addr zone=oos_auth:10m rate=10r/m;     # 로그인·가입·갱신·추가 인증
limit_req_zone  $binary_remote_addr zone=oos_api:10m  rate=30r/s;
limit_conn_zone $binary_remote_addr zone=oos_conn:10m;

upstream oos_app {
    server app:8000;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    client_max_body_size    1m;
    client_body_timeout     15s;
    client_header_timeout   15s;
    keepalive_timeout       65s;
    send_timeout            30s;
    limit_conn              oos_conn 60;
    limit_req_status        429;
    limit_conn_status       429;

    # 클라이언트가 보낸 전달 헤더·요청 ID·인증서 헤더는 덮어쓴다(위조 차단). HTTP 판에는 관리 기기 인증서가 없다 → /admin 차단
    proxy_http_version 1.1;
    # Host 는 포트까지 그대로($http_host) — $host 는 포트를 떼어, 80·443 이 아닌 포트(예: HTTP_PORT=8000)로 서비스하면
    # 브라우저 Origin(http://주소:8000)과 앱이 보는 출처(http://주소)가 달라 웹 로그인·변경 요청이 모두 403(csrf_failed)이었다.
    proxy_set_header   Host                    $http_host;
    proxy_set_header   X-Forwarded-For         $remote_addr;
    proxy_set_header   X-Forwarded-Proto       $scheme;
    proxy_set_header   X-Request-ID            $request_id;
    proxy_set_header   X-Client-Cert-Verified  "NONE";
    proxy_set_header   Connection              "";
    proxy_read_timeout 60s;

    location ~ /\.                          { deny all; }
    location ~ ^/(docs|redoc|openapi\.json) { return 404; }
    location /admin/                        { return 403; }              # 관리 기능은 TLS + 관리 기기 인증서(compose-tls)에서만

    location ~ ^/auth/(login|register|refresh|step-up)$ {
        limit_req zone=oos_auth burst=5 nodelay;
        proxy_pass http://oos_app;
    }
    location = /events {                                                 # SSE — 버퍼링 없이 바로 흘려보내고 오래 연결 유지
        proxy_pass http://oos_app;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        limit_req zone=oos_api burst=20 nodelay;
    }
    # 화면 자산(web/assets·web/images) — 캐시 정책은 앱이 정한다(그림 하루 · 스크립트는 매번 확인해 배포 즉시 새 코드).
    # 화면 한 장이 그림·스크립트를 여러 개 받으므로 API 용 요청 제한은 걸지 않는다(예전 /static/ 과 같은 취급)
    location ~ ^/(assets|images)/ {
        proxy_pass http://oos_app;
    }

    location / {
        limit_req zone=oos_api burst=60 nodelay;
        proxy_pass http://oos_app;
    }
}
