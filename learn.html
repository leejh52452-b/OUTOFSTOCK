<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학습하기 - OUTOFSTOCK</title>
    <link rel="icon" type="image/png" href="assets/logo-mark.png">
    <style>
        body[data-theme="brand-light"] {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --card-border: #cbd5e1;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --accent-blue: #3730a3;
            --accent-green: #16a34a;
            --accent-red: #dc2626;
            --input-bg: #ffffff;
            --hover-bg: #e0e7ff;
            --item-bg: #f8fafc;
            --art-plate: transparent;
            --login-bg: linear-gradient(180deg, #e0e7ff 0%, #ffffff 100%);
            --badge-mid-bg: #fef08a; --badge-mid-text: #854d0e;
            --badge-hard-bg: #fecdd3; --badge-hard-text: #9f1239;
            --guide-bg: #dbeafe; --guide-text: #1e40af;
        }
        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", Roboto, sans-serif;
            transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 이미지 공통: 어두운 테마에서는 밝은 판 위에 올려 외곽선이 묻히지 않게 */
        .art-plate { background-color: var(--art-plate); border-radius: 12px; }
        img { display: block; max-width: 100%; }

        /* 사이드바 */
        .sidebar {
            width: 244px; background-color: var(--card-bg);
            border-right: 1px solid var(--card-border);
            display: flex; flex-direction: column; z-index: 100; flex-shrink: 0;
        }
        .sidebar.collapsed { width: 72px; }
        .sidebar-header {
            height: 76px; display: flex; align-items: center;
            padding: 0 16px; gap: 10px; border-bottom: 1px solid var(--card-border);
        }
        .sidebar.collapsed .sidebar-header { justify-content: center; padding: 0; }
        .toggle-btn {
            background: none; border: none; color: var(--text-secondary);
            cursor: pointer; padding: 6px; border-radius: 6px; display: flex; align-items: center; flex-shrink: 0;
        }
        .toggle-btn:hover { background-color: var(--hover-bg); }
        .logo { display: flex; align-items: center; min-width: 0; }
        .logo-img { height: 38px; width: auto; padding: 3px 7px; box-sizing: content-box; max-width: 100%; }
        .sidebar.collapsed .logo, .sidebar.collapsed .nav-text { display: none; }
        .nav-menu { list-style: none; padding: 16px 10px; }
        .nav-item { margin-bottom: 4px; }
        .nav-link {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 12px; color: var(--text-secondary);
            text-decoration: none; border-radius: 8px; font-weight: 500; font-size: 13.5px; white-space: nowrap;
        }
        .sidebar.collapsed .nav-link { justify-content: center; padding: 10px 0; }
        .nav-link svg { width: 18px; height: 18px; stroke: var(--text-secondary); flex-shrink: 0; }
        .nav-link:hover, .nav-link.active {
            background-color: var(--hover-bg); color: var(--accent-blue); font-weight: 600;
        }
        .nav-link:hover svg, .nav-link.active svg { stroke: var(--accent-blue); }

        /* 메인 */
        .main-wrapper { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow-y: auto; }
        header {
            position: relative; height: 76px; padding: 0 28px; display: flex; align-items: center;
            border-bottom: 1px solid var(--card-border); background-color: var(--card-bg);
        }
        .header-logo {
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            display: flex; align-items: center;
        }
        .header-logo img { height: 56px; width: auto; padding: 3px 12px; box-sizing: content-box; }
        .search-box { position: relative; width: 320px; max-width: 100%; }
        .search-box input {
            width: 100%; padding: 8px 16px 8px 36px; background-color: var(--item-bg);
            border: 1px solid var(--card-border); border-radius: 8px;
            color: var(--text-primary); outline: none; font-size: 13px;
        }
        .search-box input:focus { border-color: var(--accent-blue); }
        .search-icon {
            position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
            width: 16px; height: 16px; display: flex;
        }
        .search-icon svg { width: 16px; height: 16px; stroke: var(--text-muted); }
        .content-container {
            padding: 20px 28px; display: flex; flex-direction: column; gap: 20px;
            width: 100%; max-width: 1440px; margin: 0 auto;
        }


        [hidden] { display: none !important; }
        .main-wrapper { overflow-y: visible; }
        .content-container { word-break: keep-all; overflow-wrap: break-word; }
        .card-header { margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .card-title { font-size: 14px; font-weight: 700; letter-spacing: -0.3px; display: flex; align-items: center; gap: 8px; }
        .card-title svg { width: 17px; height: 17px; stroke: var(--accent-blue); flex-shrink: 0; }
        .badge { padding: 2px 7px; border-radius: 4px; font-size: 10.5px; font-weight: 700; width: fit-content; white-space: nowrap; }
        .badge-basic { background-color: #dcfce7; color: #166534; }
        .badge-mid { background-color: var(--badge-mid-bg); color: var(--badge-mid-text); }
        svg.ico { width: 16px; height: 16px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .num { font-variant-numeric: tabular-nums; }

        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none;
            padding: 8px 14px; border-radius: 6px; font-size: 12.5px; font-weight: 700; cursor: pointer;
            border: 1px solid var(--card-border); background-color: var(--card-bg); color: var(--text-secondary);
            transition: background-color .15s, border-color .15s, color .15s, filter .15s;
        }
        .btn:hover { border-color: var(--accent-blue); color: var(--accent-blue); }
        .btn.primary { background-color: var(--accent-blue); border-color: var(--accent-blue); color: #fff; }
        .btn.primary:hover { filter: brightness(1.1); color: #fff; }
        .btn.outline { background-color: #fff; border-color: var(--accent-blue); color: var(--accent-blue); }
        .btn.outline:hover { background-color: var(--hover-bg); }
        .btn.block { width: 100%; }
        .btn svg.ico { width: 14px; height: 14px; }
        .chip {
            display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; padding: 3px 9px;
            border-radius: 999px; background: var(--item-bg); border: 1px solid var(--card-border); color: var(--text-secondary);
        }
        button.chip { cursor: pointer; font-family: inherit; }
        button.chip:hover { border-color: var(--accent-blue); color: var(--accent-blue); background: var(--hover-bg); }
        .chip svg.ico { width: 12px; height: 12px; }
        .chip.on { background: var(--accent-blue); border-color: var(--accent-blue); color: #fff; }
        .seg-group { display: inline-flex; border: 1px solid var(--card-border); border-radius: 8px; overflow: hidden; background: var(--card-bg); }
        .seg { background: none; border: none; padding: 8px 14px; font-size: 12.5px; font-weight: 700; color: var(--text-secondary); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; font-family: inherit; }
        .seg + .seg { border-left: 1px solid var(--card-border); }
        .seg:hover { color: var(--accent-blue); }
        .seg.active { background: var(--hover-bg); color: var(--accent-blue); }
        .seg .cnt { font-size: 11px; font-weight: 700; opacity: .75; }

        .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
        .page-title { font-size: 20px; font-weight: 800; letter-spacing: -0.4px; }
        .page-sub { font-size: 12.5px; color: var(--text-secondary); margin-top: 4px; line-height: 1.5; }
        .dashboard-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
        .left-column, .right-column { display: flex; flex-direction: column; gap: 20px; }
        .card { background-color: var(--card-bg); border: 1px solid var(--card-border); border-radius: 8px; padding: 16px 18px; }

        /* ===== 검색 / 필터 ===== */
        .controls { display: flex; flex-direction: column; gap: 12px; padding: 14px 16px; }
        .search-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .term-search { position: relative; flex: 1 1 320px; min-width: 0; }
        .term-search > svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; stroke: var(--text-muted); pointer-events: none; }
        .term-search input {
            width: 100%; padding: 11px 38px 11px 38px; background: var(--item-bg); border: 1px solid var(--card-border);
            border-radius: 8px; color: var(--text-primary); outline: none; font-size: 13.5px; font-family: inherit;
        }
        .term-search input:focus { border-color: var(--accent-blue); background: #fff; }
        .term-search input::-webkit-search-cancel-button { display: none; }
        .search-clear {
            position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 24px; height: 24px; border-radius: 50%;
            border: none; background: var(--card-border); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .search-clear:hover { background: var(--accent-blue); }
        .search-clear svg { width: 12px; height: 12px; }
        .search-hint { font-size: 11.5px; color: var(--text-muted); margin-top: -4px; }
        .search-hint b { color: var(--accent-blue); font-weight: 700; font-size: 12.5px; letter-spacing: 0.6px; }
        .ini-bar { display: flex; flex-wrap: wrap; gap: 6px; }
        .ini-btn {
            min-width: 36px; height: 34px; padding: 0 9px; border: 1px solid var(--card-border); border-radius: 8px; background: var(--card-bg);
            font-size: 15px; font-weight: 700; color: var(--text-secondary); cursor: pointer; font-family: inherit;
            transition: background-color .12s, border-color .12s, color .12s;
        }
        .ini-btn:hover:not(:disabled) { border-color: var(--accent-blue); color: var(--accent-blue); }
        .ini-btn.active { background: var(--accent-blue); border-color: var(--accent-blue); color: #fff; }
        .ini-btn:disabled { opacity: .32; cursor: not-allowed; }
        .ini-btn.all { padding: 0 13px; font-size: 13px; }
        .result-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--text-secondary); }
        .result-head b { color: var(--text-primary); font-weight: 800; }
        .result-head .spacer { flex: 1; }
        .link-btn { background: none; border: none; color: var(--text-muted); font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; padding: 4px; }
        .link-btn:hover { color: var(--accent-blue); }

        /* ===== 용어 카드 ===== */
        .group-head { display: flex; align-items: center; gap: 10px; margin: 4px 0 12px; }
        .group-letter { min-width: 36px; height: 36px; padding: 0 9px; border-radius: 10px; background: var(--accent-blue); color: #fff; font-weight: 800; font-size: 19px; display: flex; align-items: center; justify-content: center; }
        .group-count { font-size: 12px; color: var(--text-muted); font-weight: 700; }
        .group-line { flex: 1; height: 1px; background: var(--card-border); }
        .term-group + .term-group { margin-top: 26px; }
        .term-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
        .term-card {
            display: flex; flex-direction: column; gap: 12px; padding: 16px 18px; background: var(--card-bg);
            border: 1px solid var(--card-border); border-radius: 10px; transition: border-color .15s, box-shadow .15s; scroll-margin-top: 180px;
        }
        .term-card:hover { border-color: #a5b4fc; box-shadow: 0 6px 18px rgba(55, 48, 163, 0.07); }
        .term-card.learned { border-color: #86efac; background: linear-gradient(180deg, #f0fdf4 0%, #ffffff 46%); }
        .term-card.flash { animation: flash 1.6s ease-out 1; border-color: var(--accent-blue); }
        @keyframes flash { 0% { box-shadow: 0 0 0 0 rgba(55, 48, 163, .55); } 100% { box-shadow: 0 0 0 14px rgba(55, 48, 163, 0); } }
        .term-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
        .term-name { font-size: 16.5px; font-weight: 800; letter-spacing: -0.4px; line-height: 1.35; }
        .term-name mark { background: #fde68a; color: inherit; border-radius: 3px; padding: 0 1px; }
        .term-en { font-size: 11.5px; color: var(--text-muted); font-weight: 600; margin-top: 2px; }
        .analogy { display: flex; gap: 10px; align-items: flex-start; background: #eef2ff; border: 1px solid #c7d2fe; border-radius: 10px; padding: 10px 12px; }
        .analogy img { width: 30px; height: 30px; object-fit: contain; flex-shrink: 0; margin-top: 1px; }
        .analogy-label { font-size: 10.5px; font-weight: 800; color: var(--accent-blue); letter-spacing: 0.1px; margin-bottom: 2px; }
        .analogy p { font-size: 13px; font-weight: 600; line-height: 1.6; color: var(--text-primary); }
        .explain-label { font-size: 10.5px; font-weight: 800; color: var(--text-muted); margin-bottom: 3px; }
        .term-explain { font-size: 12.8px; color: var(--text-secondary); line-height: 1.75; }
        .term-foot { display: flex; flex-direction: column; gap: 10px; margin-top: auto; padding-top: 2px; }
        .foot-tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
        .foot-label { font-size: 11px; color: var(--text-muted); font-weight: 700; margin-left: 2px; }
        .foot-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; border-top: 1px dashed var(--card-border); padding-top: 10px; }
        .learn-btn.done { background: #dcfce7; border-color: #86efac; color: #166534; }
        .learn-btn.done:hover { background: #bbf7d0; border-color: #4ade80; color: #166534; }
        .empty { text-align: center; padding: 34px 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .empty img { width: 120px; height: auto; }
        .empty .e-title { font-size: 15px; font-weight: 800; }
        .empty .e-desc { font-size: 12.5px; color: var(--text-secondary); line-height: 1.6; }

        /* ===== 사이드 패널 ===== */
        .today-card { background: var(--login-bg); display: flex; flex-direction: column; gap: 10px; }
        .today-top { display: flex; align-items: center; gap: 12px; }
        .today-top img { width: 78px; height: auto; flex-shrink: 0; }
        .today-name { font-size: 17px; font-weight: 800; letter-spacing: -0.4px; }
        .today-en { font-size: 11.5px; color: var(--text-muted); font-weight: 600; }
        .today-analogy { font-size: 12.5px; color: var(--text-secondary); line-height: 1.65; background: rgba(255,255,255,.75); border: 1px solid var(--card-border); border-radius: 8px; padding: 10px 12px; }
        .prog-big { display: flex; align-items: baseline; gap: 6px; }
        .prog-big b { font-size: 26px; font-weight: 800; letter-spacing: -0.6px; }
        .prog-big span { font-size: 13px; color: var(--text-secondary); font-weight: 600; }
        .prog-track { height: 8px; background: var(--item-bg); border: 1px solid var(--card-border); border-radius: 999px; overflow: hidden; margin: 8px 0 12px; }
        .prog-fill { height: 100%; width: 0; background: linear-gradient(90deg, #4f46e5, #22c55e); border-radius: 999px; transition: width .35s ease; }
        .prog-row { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; padding: 6px 0; border-top: 1px solid var(--card-border); color: var(--text-secondary); }
        .prog-row b { color: var(--text-primary); font-weight: 700; }
        .cat-list { display: flex; flex-direction: column; gap: 6px; }
        .cat-btn {
            display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; padding: 9px 12px; text-align: left;
            border: 1px solid var(--card-border); border-radius: 8px; background: var(--item-bg); color: var(--text-primary);
            font-size: 12.5px; font-weight: 600; cursor: pointer; font-family: inherit;
        }
        .cat-btn:hover { border-color: var(--accent-blue); }
        .cat-btn.active { background: var(--hover-bg); border-color: var(--accent-blue); color: var(--accent-blue); font-weight: 800; }
        .cat-btn .c-num { font-size: 11px; font-weight: 700; color: var(--text-muted); }
        .cat-btn.active .c-num { color: var(--accent-blue); }

        @media (min-width: 1101px) {
            .controls { position: sticky; top: 12px; z-index: 30; box-shadow: 0 8px 20px rgba(15, 23, 42, 0.06); }
        }
        @media (max-width: 1100px) {
            .dashboard-grid { grid-template-columns: minmax(0, 1fr); }
            .header-logo { display: none; }
            .term-card { scroll-margin-top: 20px; }
        }
        @media (max-width: 760px) {
            .content-container { padding: 16px; }
            .term-grid { grid-template-columns: 1fr; }
            .seg { padding: 8px 11px; }
        }
    </style>
</head>

    <div class="main-wrapper">

            </a>
            <div class="search-box">
                <div class="search-icon">

        <div class="content-container">
            <div class="page-head">
                <div>
                    <h1 class="page-title">학습하기 · 주식 용어 사전</h1>
                    <p class="page-sub">어려운 주식·금융 용어를 양봉이가 쉬운 비유로 풀어줘요. 궁금한 용어를 찾아보고, 배운 건 바로 실습해 보세요.</p>

                <div class="left-column">
                    <div class="card controls">
                        <div class="search-row">
                            <div class="term-search">
                                <svg class="ico"><use href="#i-search"/></svg>
                                <input id="q" type="search" placeholder="궁금한 주식 용어나 기법을 검색해보세요! (예: 골든크로스, RSI)" autocomplete="off" aria-label="용어 검색">
                                <button class="search-clear" id="qClear" type="button" aria-label="검색어 지우기" hidden><svg class="ico"><use href="#i-x"/></svg></button>
                            </div>
                            <div class="seg-group" id="levelTabs" role="tablist" aria-label="난이도">
                                <button class="seg active" type="button" data-act="level" data-level="all">전체 <span class="cnt num" data-cnt="all"></span></button>
                                <button class="seg" type="button" data-act="level" data-level="basic">초급 <span class="cnt num" data-cnt="basic"></span></button>
                                <button class="seg" type="button" data-act="level" data-level="mid">중급 <span class="cnt num" data-cnt="mid"></span></button>
                            </div>
                        </div>
                        <div class="search-hint">초성으로도 찾을 수 있어요. 예) <b>ㄱㄷㅋㄹㅅ</b> → 골든크로스 · 초급은 기초 용어, 중급은 보조지표·기법이에요.</div>
                        <div class="ini-bar" id="iniBar" aria-label="초성 필터"></div>
                    </div>

                    <div class="result-head" id="resultHead"></div>
                    <div id="results"></div>
                </div>

                <div class="right-column">
                    <div class="card today-card" id="todayCard"></div>
                    <div class="card" id="progressCard"></div>
                    <div class="card">
                        <div class="card-header"><div class="card-title"><svg class="ico"><use href="#i-layers"/></svg>주제별로 보기</div></div>
                        <div class="cat-list" id="catList"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
            <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></symbol>
            <symbol id="i-x" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></symbol>
            <symbol id="i-check" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></symbol>
            <symbol id="i-arrow-right" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></symbol>
            <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2V17h6v-.3c0-.8.4-1.5 1-2A7 7 0 0 0 12 2z"/></symbol>
            <symbol id="i-layers" viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></symbol>
            <symbol id="i-award" viewBox="0 0 24 24"><circle cx="12" cy="8" r="6"/><path d="M15.5 13.5 17 22l-5-3-5 3 1.5-8.5"/></symbol>
            <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></symbol>
            <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></symbol>
        </defs>
    </svg>

    <script src="assets/terms.js"></script>
    <script>
// ============================================================
//  학습하기 화면 로직 (프론트 전용)
//  - 초성(ㄱㄴㄷ…/A-Z) 필터, 검색(초성 검색 지원), 난이도·주제 필터
//  - '이해했어요' 표시는 localStorage에 저장 (outofstock_learned_terms)
//  - 딥링크: learn.html?term=골든크로스  /  learn.html?q=RSI
// ============================================================
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const ico = (n) => `<svg class="ico"><use href="#i-${n}"/></svg>`;
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = (s) => String(s).toLowerCase().replace(/[\s\/·()\-&+]/g, '');

const CHO = ['ㄱ', 'ㄲ', 'ㄴ', 'ㄷ', 'ㄸ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅃ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅉ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];
const CHO_BASE = { 'ㄲ': 'ㄱ', 'ㄸ': 'ㄷ', 'ㅃ': 'ㅂ', 'ㅆ': 'ㅅ', 'ㅉ': 'ㅈ' };
const ORDER = ['ㄱ', 'ㄴ', 'ㄷ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅅ', 'ㅇ', 'ㅈ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ', 'A-Z'];
const CAT_ORDER = ['차트 기초', '거래 기초', '자금·계좌', '시장·지수', '기업·재무', '투자 상품', '제도·이벤트', '위험 관리', '보조지표·기법'];
const LV = { basic: { label: '초급', cls: 'badge-basic' }, mid: { label: '중급', cls: 'badge-mid' } };
const PRACTICE = {
    golden: { label: '골든크로스 실습하러 가기', href: 'practice.html?t=golden' },
    rsi: { label: 'RSI 실습하러 가기', href: 'practice.html?t=rsi' },
    any: { label: '실습하러 가기', href: 'practice.html' }
};

function initialOf(name) {
    const c = name.trim()[0], code = c.charCodeAt(0);
    if (code >= 0xAC00 && code <= 0xD7A3) { const ch = CHO[Math.floor((code - 0xAC00) / 588)]; return CHO_BASE[ch] || ch; }
    return /[A-Za-z0-9]/.test(c) ? 'A-Z' : '기타';
}
function choseongOf(str) {
    return Array.from(str).map((ch) => { const c = ch.charCodeAt(0); return c >= 0xAC00 && c <= 0xD7A3 ? CHO[Math.floor((c - 0xAC00) / 588)] : ch.toLowerCase(); }).join('');
}
const isChoseongQuery = (s) => /^[ㄱ-ㅎ]+$/.test(s.replace(/\s+/g, ''));

// ---- 데이터 가공 ----
TERMS.forEach((t) => {
    t.id = t.name;
    t.initial = initialOf(t.name);
    t.ini = choseongOf(t.name.replace(/\s/g, ''));
    t.keys = [t.name, t.en, ...t.alias].map(norm);
    t.body = norm(t.analogy + t.explain);
});
const byKey = new Map();
TERMS.forEach((t) => [t.name, ...t.alias].forEach((a) => { if (!byKey.has(norm(a))) byKey.set(norm(a), t); }));
const resolve = (ref) => byKey.get(norm(ref)) || null;

// ---- 상태 / 저장 ----
const LKEY = 'outofstock_learned_terms';
const state = { q: '', level: 'all', initial: 'all', cat: null };
let learned = new Set();
try { learned = new Set(JSON.parse(localStorage.getItem(LKEY)) || []); } catch (e) { learned = new Set(); }
learned = new Set([...learned].filter((id) => TERMS.some((t) => t.id === id)));
const saveLearned = () => { try { localStorage.setItem(LKEY, JSON.stringify([...learned])); } catch (e) { /* 저장 실패해도 진행 */ } };

// ---- 검색 ----
function matchQuery(t, q, isIni) {
    if (!q) return true;
    if (isIni) return t.ini.includes(q.replace(/\s+/g, ''));
    const n = norm(q);
    return t.keys.some((k) => k.includes(n)) || t.body.includes(n);
}
function score(t, q) {
    const n = norm(q);
    if (t.keys[0].startsWith(n)) return 0;
    if (t.keys[0].includes(n)) return 1;
    if (t.keys.some((k) => k.includes(n))) return 2;
    return 3;
}
function highlight(text, q) {
    if (!q) return esc(text);
    const i = text.toLowerCase().indexOf(q.toLowerCase());
    if (i < 0) return esc(text);
    return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length));
}

// ---- 카드 ----
function cardHTML(t, q, isIni) {
    const done = learned.has(t.id), lv = LV[t.level];
    const rel = t.related.map(resolve).filter((r, i, a) => r && r !== t && a.indexOf(r) === i);
    const pr = t.practice ? PRACTICE[t.practice] : null;
    return `
    <article class="term-card${done ? ' learned' : ''}" data-id="${esc(t.id)}">
        <div class="term-head">
            <div><h3 class="term-name">${isIni ? esc(t.name) : highlight(t.name, q)}</h3><div class="term-en">${esc(t.en)}</div></div>
            <span class="badge ${lv.cls}">${lv.label}</span>
        </div>
        <div class="analogy">
            <img src="assets/logo-mark.png" alt="">
            <div><div class="analogy-label">양봉이의 한 줄 비유</div><p>${esc(t.analogy)}</p></div>
        </div>
        <div><div class="explain-label">쉬운 개념 풀이</div><p class="term-explain">${esc(t.explain).replace(/\n/g, '<br>')}</p></div>
        <div class="term-foot">
            <div class="foot-tags">
                <span class="chip">${esc(t.cat)}</span>
                ${rel.length ? `<span class="foot-label">연관 용어</span>` + rel.map((r) => `<button class="chip" type="button" data-act="jump" data-id="${esc(r.id)}">${ico('link')}${esc(r.name)}</button>`).join('') : ''}
            </div>
            <div class="foot-actions">
                ${pr ? `<a class="btn outline" href="${pr.href}">${esc(pr.label)}${ico('arrow-right')}</a>` : ''}
                <button class="btn learn-btn${done ? ' done' : ''}" type="button" data-act="learned" data-id="${esc(t.id)}">${learnLabel(done)}</button>
            </div>
        </div>
    </article>`;
}
const learnLabel = (done) => (done ? ico('check') + '학습 완료' : ico('bulb') + '이해했어요');
const gridHTML = (list, q, isIni) => `<div class="term-grid">${list.map((t) => cardHTML(t, q, isIni)).join('')}</div>`;

// ---- 렌더 ----
function render() {
    const q = state.q.trim(), isIni = !!q && isChoseongQuery(q);
    const base = TERMS.filter((t) => (!state.cat || t.cat === state.cat) && matchQuery(t, q, isIni));
    const lvCnt = { all: base.length, basic: 0, mid: 0 };
    base.forEach((t) => lvCnt[t.level]++);
    $$('[data-cnt]').forEach((el) => { el.textContent = lvCnt[el.dataset.cnt]; });
    $$('#levelTabs .seg').forEach((b) => b.classList.toggle('active', b.dataset.level === state.level));

    const byLevel = base.filter((t) => state.level === 'all' || t.level === state.level);
    const iniCnt = {}; byLevel.forEach((t) => { iniCnt[t.initial] = (iniCnt[t.initial] || 0) + 1; });
    if (state.initial !== 'all' && !iniCnt[state.initial]) state.initial = 'all';
    $('#iniBar').innerHTML = ['all', ...ORDER].map((k) => k === 'all'
        ? `<button class="ini-btn all${state.initial === 'all' ? ' active' : ''}" type="button" data-act="ini" data-ini="all">전체</button>`
        : `<button class="ini-btn${state.initial === k ? ' active' : ''}" type="button" data-act="ini" data-ini="${k}" ${iniCnt[k] ? '' : 'disabled'} title="${iniCnt[k] || 0}개">${k}</button>`).join('');

    const list = byLevel.filter((t) => state.initial === 'all' || t.initial === state.initial);
    const filtered = !!(q || state.level !== 'all' || state.initial !== 'all' || state.cat);
    $('#resultHead').innerHTML = `
        <span>총 <b class="num">${list.length}</b>개 용어${q ? ` · <b>'${esc(q)}'</b> 검색 결과` : ''}</span>
        ${state.cat ? `<button class="chip on" type="button" data-act="clear-cat">${esc(state.cat)} ${ico('x')}</button>` : ''}
        <span class="spacer"></span>
        ${filtered ? `<button class="link-btn" type="button" data-act="reset">필터 초기화</button>` : ''}`;

    const box = $('#results');
    if (!list.length) {
        box.innerHTML = `<div class="card empty"><img src="assets/sad.png" alt="슬퍼하는 양봉이"><div class="e-title">찾는 용어가 없어요</div><div class="e-desc">다른 검색어로 찾아보거나 필터를 초기화해 보세요.<br>없는 용어는 계속 추가할 예정이에요.</div><button class="btn primary" type="button" data-act="reset">필터 초기화</button></div>`;
    } else if (q) {
        box.innerHTML = gridHTML(list.slice().sort((a, b) => score(a, q) - score(b, q) || a.name.localeCompare(b.name, 'ko')), q, isIni);
    } else {
        const groups = ORDER.map((k) => [k, list.filter((t) => t.initial === k)]).filter((g) => g[1].length);
        box.innerHTML = groups.map(([k, items]) => `
            <section class="term-group" data-group="${k}">
                <div class="group-head"><div class="group-letter">${k}</div><span class="group-count num">${items.length}개</span><span class="group-line"></span></div>
                ${gridHTML(items.slice().sort((a, b) => a.name.localeCompare(b.name, k === 'A-Z' ? 'en' : 'ko')), q, isIni)}
            </section>`).join('');
    }
    renderCats();
}

// ---- 사이드 패널 ----
function renderProgress() {
    const total = TERMS.length, n = learned.size, pct = Math.round((n / total) * 100);
    const cnt = (lv) => [TERMS.filter((t) => t.level === lv && learned.has(t.id)).length, TERMS.filter((t) => t.level === lv).length];
    const [b1, b2] = cnt('basic'), [m1, m2] = cnt('mid');
    $('#progressCard').innerHTML = `
        <div class="card-header"><div class="card-title">${ico('award')}나의 학습 현황</div><span class="chip">${pct}%</span></div>
        <div class="prog-big"><b class="num">${n}</b><span>/ ${total}개 학습 완료</span></div>
        <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>
        <div class="prog-row"><span>초급 용어</span><b class="num">${b1} / ${b2}</b></div>
        <div class="prog-row"><span>중급 용어</span><b class="num">${m1} / ${m2}</b></div>
        <a class="btn primary block" href="practice.html" style="margin-top:12px">${ico('target')}배운 걸 실습해 보기</a>
        ${n ? `<div style="text-align:center;margin-top:6px"><button class="link-btn" type="button" data-act="reset-progress">학습 기록 지우기</button></div>` : ''}`;
}
function renderCats() {
    const total = (c) => TERMS.filter((t) => t.cat === c).length, done = (c) => TERMS.filter((t) => t.cat === c && learned.has(t.id)).length;
    $('#catList').innerHTML = `<button class="cat-btn${state.cat ? '' : ' active'}" type="button" data-act="cat" data-cat="">전체 주제<span class="c-num num">${TERMS.length}</span></button>`
        + CAT_ORDER.map((c) => `<button class="cat-btn${state.cat === c ? ' active' : ''}" type="button" data-act="cat" data-cat="${esc(c)}">${esc(c)}<span class="c-num num">${done(c)} / ${total(c)}</span></button>`).join('');
}
function todayTerm() { const d = new Date(); return TERMS[Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000) % TERMS.length]; }
function renderToday() {
    const t = todayTerm();
    $('#todayCard').innerHTML = `
        <div class="card-title">${ico('bulb')}오늘의 용어</div>
        <div class="today-top"><img src="assets/study.png" alt="공부하는 양봉이"><div><div class="today-name">${esc(t.name)}</div><div class="today-en">${esc(t.en)}</div></div></div>
        <div class="today-analogy">${esc(t.analogy)}</div>
        <button class="btn outline block" type="button" data-act="jump" data-id="${esc(t.id)}">자세히 보기${ico('arrow-right')}</button>`;
}

// ---- 동작 ----
const findCard = (id) => $$('.term-card').find((el) => el.dataset.id === id);
function resetFilters() { state.q = ''; state.level = 'all'; state.initial = 'all'; state.cat = null; $('#q').value = ''; $('#qClear').hidden = true; }
function jumpTo(id) {
    resetFilters(); render();
    const card = findCard(id); if (!card) return;
    card.scrollIntoView({ behavior: 'smooth', block: 'start' });
    card.classList.remove('flash'); void card.offsetWidth; card.classList.add('flash');
}
function toggleLearned(id) {
    learned.has(id) ? learned.delete(id) : learned.add(id); saveLearned();
    const card = findCard(id), done = learned.has(id);
    if (card) { card.classList.toggle('learned', done); const b = $('.learn-btn', card); b.classList.toggle('done', done); b.innerHTML = learnLabel(done); }
    renderProgress(); renderCats();
}

document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    const act = el.dataset.act;
    if (act === 'level') { state.level = el.dataset.level; render(); }
    else if (act === 'ini') { state.initial = el.dataset.ini; render(); }
    else if (act === 'cat') { state.cat = el.dataset.cat || null; state.initial = 'all'; render(); }
    else if (act === 'clear-cat') { state.cat = null; render(); }
    else if (act === 'reset') { resetFilters(); render(); }
    else if (act === 'jump') jumpTo(el.dataset.id);
    else if (act === 'learned') toggleLearned(el.dataset.id);
    else if (act === 'reset-progress') { if (confirm('학습 기록을 모두 지울까요?')) { learned.clear(); saveLearned(); renderProgress(); render(); } }
});
$('#q').addEventListener('input', (e) => { state.q = e.target.value; state.initial = 'all'; $('#qClear').hidden = !state.q; render(); });
$('#qClear').addEventListener('click', () => { $('#q').value = ''; state.q = ''; $('#qClear').hidden = true; render(); $('#q').focus(); });
const sidebar = $('#sidebar');
$('#toggleBtn').addEventListener('click', () => sidebar.classList.toggle('collapsed'));
if (window.innerWidth <= 760) sidebar.classList.add('collapsed');

// ---- 시작 ----
renderToday(); renderProgress(); render();
(function initFromUrl() {
    const p = new URLSearchParams(location.search), term = p.get('term'), q = p.get('q');
    if (term) { const t = resolve(term) || TERMS.find((x) => x.keys.some((k) => k.includes(norm(term)))); if (t) { setTimeout(() => jumpTo(t.id), 60); return; } }
    if (q) { $('#q').value = q; state.q = q; $('#qClear').hidden = false; render(); }
})();
window.__L = { TERMS, state, render, jumpTo, resolve, toggleLearned, learned: () => [...learned] };

    </script>
</body>
